<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weaver Blitz</title>
<link rel="stylesheet" href="styles.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>
</head>
<body>
<div id="root"></div>
<div id="debugerr" style="white-space:pre-wrap;font-family:monospace;font-size:12px;padding:20px;color:red;"></div>
<script>
window.addEventListener('error', function(e) {
  document.getElementById('debugerr').textContent += 'ERROR: ' + e.message + '\n' + (e.error && e.error.stack || '') + '\n\n';
});
</script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
